<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<div class="card" id="voice-card" hidden>
  <h2 style="margin-top:0">Voice call with VoiceMitra</h2>
  <p class="empty">Allow the microphone when asked, then speak after the agent greets you.</p>
  <p id="voice-status" class="hold-note">Connecting&hellip;</p>
  <div id="voice-audio"></div>
</div>

<div class="card" id="chat-card" hidden>
  <h2 style="margin-top:0">Call with VoiceMitra</h2>
  <div id="chat-log" class="chat-log"></div>
  <p id="chat-hold" class="hold-note" hidden></p>
  <form id="chat-form" class="inline-form" autocomplete="off">
    <input id="chat-input" name="text" placeholder="Type your reply" maxlength="2000" style="flex:1" required>
    <button type="submit">Send</button>
  </form>
  <p id="chat-ended" class="empty" hidden>The call has ended.</p>
</div>

<script>
(function () {
  const card = document.getElementById("chat-card");
  const log = document.getElementById("chat-log");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const holdNote = document.getElementById("chat-hold");
  const endedNote = document.getElementById("chat-ended");

  let ws = null;
  let callId = null;
  let shown = 0;  // messages already rendered; the server numbers them from 0
  let retryMs = 500;
  let doctorName = "Doctor";

  function addMessage(m) {
    if (m.index < shown) return;  // already have it (snapshot and live events can overlap)
    const div = document.createElement("div");
    div.className = "chat-msg " + m.role;
    if (m.role === "doctor") {
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = doctorName;
      div.appendChild(who);
    }
    div.appendChild(document.createTextNode(m.text));  // text node, never innerHTML: it's untrusted
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    shown = m.index + 1;
  }

  function startCall(id) {
    callId = id;
    shown = 0;
    log.replaceChildren();
    card.hidden = false;
    form.hidden = false;
    holdNote.hidden = true;
    endedNote.hidden = true;
  }

  function endCall() {
    form.hidden = true;
    holdNote.hidden = true;
    endedNote.hidden = false;
  }

  // The agent has handed the call to a doctor: the patient is held until the doctor is merged in,
  // and can only type once they have been.
  function applyEscalation(e) {
    if (e.doctor_name) doctorName = e.doctor_name;
    if (e.status === "merged") {
      form.hidden = false;
      holdNote.hidden = true;
      input.placeholder = "Message to " + doctorName;
    } else {
      form.hidden = true;
      holdNote.hidden = false;
      holdNote.textContent = e.status === "briefing"
        ? doctorName + " has picked up and is being briefed. Please hold."
        : "Connecting you to the doctor. Please hold.";
    }
  }

  const voiceCard = document.getElementById("voice-card");
  const voiceStatus = document.getElementById("voice-status");
  const voiceAudio = document.getElementById("voice-audio");
  let voiceRoom = null;
  async function showVoice(v) {
    if (voiceRoom) return;  // already connected (snapshot and live event can both arrive)
    voiceCard.hidden = false;
    voiceStatus.textContent = "Connecting...";
    try {
      const room = new LivekitClient.Room();
      voiceRoom = room;
      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
        if (track.kind === "audio") voiceAudio.appendChild(track.attach());  // plays the agent's voice
      });
      room.on(LivekitClient.RoomEvent.Disconnected, () => { voiceStatus.textContent = "Call ended."; });
      await room.connect(v.url, v.token);
      await room.localParticipant.setMicrophoneEnabled(true);
      voiceStatus.textContent = "Connected. Speak after the agent greets you.";
    } catch (err) {
      voiceStatus.textContent = "Could not start the call: " + err.message;
    }
  }
  function hideVoice() {
    if (voiceRoom) { voiceRoom.disconnect(); voiceRoom = null; }
    voiceAudio.replaceChildren();
    voiceCard.hidden = true;
  }

  function onEvent(e) {
    if (e.type === "voice_call") { showVoice(e); return; }
    if (e.type === "voice_call_ended") { hideVoice(); return; }
    if (e.type === "snapshot" && e.voice) { showVoice(e.voice); return; }
    if (e.type === "snapshot") {
      hideVoice();
      if (!e.call_id) { card.hidden = true; callId = null; return; }
      startCall(e.call_id);
      if (e.escalation) applyEscalation(e.escalation);
      e.messages.forEach(addMessage);
      if (!e.active) endCall();
    } else if (e.type === "call_started") {
      startCall(e.call_id);
    } else if (e.type === "message" && e.call_id === callId) {
      addMessage(e);
    } else if (e.type === "escalation" && e.call_id === callId) {
      applyEscalation(e);
    } else if (e.type === "call_ended" && e.call_id === callId) {
      endCall();
    }
  }

  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host +
                       "/ws/patients/{{ patient.id }}/chat");
    ws.onopen = () => { retryMs = 500; };
    ws.onmessage = (ev) => onEvent(JSON.parse(ev.data));
    ws.onclose = () => {
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 10000);
    };
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({type: "reply", text}));
    input.value = "";  // our own message comes back as a "message" event and is rendered from that
  });

  connect();
})();
</script>
