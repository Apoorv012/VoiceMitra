# Backend CI/CD (deploy/README.md explains the setup).
#   pull request -> test
#   push to main -> test -> build the image (ghcr.io) -> deploy to the server
# The deploy job is skipped until the repository variable DEPLOY_HOST is set, so this works before the
# AWS server exists. Run it by hand from the Actions tab ("Run workflow") to redeploy without a commit.

name: Backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - core/**
      - domains/**
      - tests/**
      - requirements.txt
      - requirements.lock
      - Dockerfile
      - .dockerignore
      - deploy/**
      - web/openapi.json
      - .github/workflows/backend.yml
  pull_request:
    paths:
      - backend/**
      - core/**
      - domains/**
      - tests/**
      - requirements.txt
      - requirements.lock
      - Dockerfile
      - .dockerignore
      - deploy/**
      - web/openapi.json
      - .github/workflows/backend.yml
  workflow_dispatch:

# One run at a time per branch, and never cancel a deploy half-way.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/apoorv012/voicemitra-api

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Tests
        run: python -m pytest -q
        env:
          MONGODB_URI: mongodb://localhost:27017
      - name: web/openapi.json matches the API (else run `python -m backend.dump_openapi` and `npm run gen:api`)
        run: |
          python -m backend.dump_openapi
          git diff --exit-code -- web/openapi.json

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        if: contains(vars.IMAGE_PLATFORMS, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 for t3/c7i/m7i instances; set the variable IMAGE_PLATFORMS=linux/arm64 for Graviton (t4g).
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH key and host key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the server's host key as first seen (see deploy/README.md)"
            ssh-keyscan -T 10 "$HOST" > ~/.ssh/known_hosts
          fi
      - name: Copy compose file and deploy script
        env:
          TARGET: ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
        run: scp -i ~/.ssh/id_deploy deploy/docker-compose.yml deploy/remote-deploy.sh "$TARGET:/opt/voicemitra/"
      - name: Deploy ${{ github.sha }}
        env:
          TARGET: ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The registry token goes over stdin, so it never shows in the server's process list or shell history.
        run: |
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "bash /opt/voicemitra/remote-deploy.sh ${{ github.sha }} ${{ github.actor }}"
